services:

  # ── Dagobert (Case Management) ─────────────────────────────────────
  dagobert:
    image: ghcr.io/sprungknoedl/dagobert:latest
    container_name: dagobert
    restart: unless-stopped
    # Порт НЕ пробрасується на хост — доступ тільки через nginx-dagobert
    # n8n звертається напряму: http://dagobert:8080/api/...
    expose:
      - "8080"
    env_file:
      - dagobert.env
    volumes:
      - dagobert_data:/app/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── nginx: TLS-термінатор для Dagobert ────────────────────────────
  nginx-dagobert:
    image: nginx:alpine
    container_name: nginx-dagobert
    restart: unless-stopped
    ports:
      - "8080:443"
    volumes:
      - ./nginx-dagobert.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    networks:
      - soc-net
    depends_on:
      dagobert:
        condition: service_healthy

  # ── n8n ────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_PROTOCOL=https
      - N8N_SSL_CERT=/home/node/.n8n/certs/server.crt
      - N8N_SSL_KEY=/home/node/.n8n/certs/server.key
    volumes:
      - n8n_data:/home/node/.n8n
      - ./certs:/home/node/.n8n/certs:ro
    networks:
      - soc-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  n8n_data:
    driver: local
  dagobert_data:
    driver: local

networks:
  soc-net:
    driver: bridge
